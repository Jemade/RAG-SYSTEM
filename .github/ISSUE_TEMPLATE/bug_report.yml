name: Bug report
description: Report a reproducible defect
title: "bug: "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest reproducible example using synthetic data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Commit, Python version, OS and relevant deployment mode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or failing test
      description: Remove credentials and private data before posting.
