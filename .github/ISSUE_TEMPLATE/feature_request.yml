name: Feature request
description: Propose an improvement grounded in a user need
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Who needs this and what can they not do today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
