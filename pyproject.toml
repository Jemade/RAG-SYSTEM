[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "rag-system"
version = "1.0.0"
description = "Observable hybrid retrieval with evidence validation and regression evaluations"
requires-python = ">=3.11"
dependencies = ["langchain-text-splitters>=0.3,<2", "qdrant-client>=1.14,<2", "rank-bm25>=0.2.2,<0.3", "numpy>=1.26,<3", "openai>=1.60,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx[socks]>=0.28,<1"]
[project.optional-dependencies]
models = ["sentence-transformers>=3,<6"]
evals = ["ragas==0.4.3", "langchain-community==0.3.31"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
[project.scripts]
rag-system = "rag_system.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
